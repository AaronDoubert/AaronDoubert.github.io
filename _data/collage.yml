# Home page "Selected work" grid, in display order.
#   img   - a file in assets/img/
#   slug  - must match the `slug:` in a file in _projects/
#   size  - omit for a one-third tile, or "wide" for a half-width tile.
#           Keep each row adding up: wide+wide, or three plain tiles.
#   photo - true for camera photos (fills the tile). Omit for CAD renders.
#   tone  - 'dark' or 'grey' when the render has its own flat background, so the
#           frame matches it instead of boxing it in a rectangle.
#
# Blank lines below mark where each row breaks, so it's easy to keep the rhythm.
# Try not to put two tiles from the same project directly above each other.

